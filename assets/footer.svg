<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" role="img">
<style>
text{font-family:-apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace}

.bg{fill:#f6f8fa}
.border{stroke:#d0d7de}
.fg{fill:#1f2328}
.muted{fill:#656d76}
.rule{fill:#d0d7de}
@media (prefers-color-scheme: dark){
.bg{fill:#161b22}
.border{stroke:#30363d}
.fg{fill:#e6edf3}
.muted{fill:#8b949e}
.rule{fill:#30363d}
}

.in{animation:rise 1.6s ease-out both}
.d2{animation-delay:.5s}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion: reduce){
*{animation:none !important}
.sweep{display:none}
}
</style>
<rect class="bg border" x="0.5" y="0.5" width="899" height="119" rx="12"/>
<text class="fg in" x="450" y="52" font-size="22" font-weight="600" text-anchor="middle">感谢阅读 · Thanks for stopping by</text>
<text class="muted mono in d2" x="450" y="86" font-size="16" text-anchor="middle" xml:space="preserve">Email  xianengqi@gmail.com    WeChat  xianengqi</text>
</svg>
